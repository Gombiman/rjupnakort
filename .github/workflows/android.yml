name: Android app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "rjupnakort.html"
      - "sw.js"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RK_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setja upp pakka
        run: npm ci

      - name: Undirbúa vefhluta og Android
        run: npm run sync

      - name: Undirskriftarlykill
        env:
          RK_KEYSTORE_B64: ${{ secrets.RK_KEYSTORE_B64 }}
        run: |
          if [ -n "$RK_KEYSTORE_B64" ]; then
            echo "$RK_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rk.p12"
            echo "RK_KEYSTORE=$RUNNER_TEMP/rk.p12" >> "$GITHUB_ENV"
            echo "Undirritað með lykli hópsins"
          else
            echo "::warning::Enginn undirskriftarlykill (RK_KEYSTORE_B64). Byggt með prófunarlykli og gefið út sem prufa."
          fi

      - name: Byggja .apk
        working-directory: app/android
        env:
          RK_KEYSTORE_PASSWORD: ${{ secrets.RK_KEYSTORE_PASSWORD }}
          RK_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/rjupnakort.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: rjupnakort-apk
          path: rjupnakort.apk
          retention-days: 14

      - name: Gefa út (aðeins undirritað)
        if: env.RK_KEYSTORE != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app >/dev/null 2>&1 || gh release create app --title "Rjúpnakort app" --notes "Nýjasta útgáfa af Android appinu. Sæktu rjupnakort.apk hér fyrir neðan." --latest
          gh release upload app rjupnakort.apk --clobber
          {
            echo "Nýjasta útgáfa: 0.1.${{ github.run_number }} ($(date -u +%Y-%m-%d)). Sæktu rjupnakort.apk hér fyrir neðan."
            echo
            awk '/^## /{n++} n==1' CHANGES.md
          } > release-notes.md
          gh release edit app --notes-file release-notes.md

      - name: Gefa út prufu (ekki undirritað með lykli hópsins)
        if: env.RK_KEYSTORE == ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp rjupnakort.apk rjupnakort-prufa.apk
          gh release view app-prufa >/dev/null 2>&1 || gh release create app-prufa --title "Rjúpnakort app (prufa)" --notes "Prufuútgáfa." --prerelease
          gh release upload app-prufa rjupnakort-prufa.apk --clobber
          gh release edit app-prufa --notes "Prufuútgáfa 0.1.${{ github.run_number }} ($(date -u +%Y-%m-%d)). Til að setja upp nýja prufu þarf fyrst að fjarlægja þá gömlu."
